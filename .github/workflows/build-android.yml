name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Godot Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: stable
      PROJECT_PATH: game
      APK_PATH: game/build/android/Xuwyx-Case-2.43.0-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-${GODOT_STATUS}"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"

          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${release}_linux.x86_64" /usr/local/bin/godot

          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_export_templates.tpz"
          mkdir -p "$template_dir"
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          cp -a /tmp/export-templates/templates/. "$template_dir/"

          godot --version

      - name: Import project and validate scenes
        run: godot --headless --path "$PROJECT_PATH" --editor --quit-after 30

      - name: Build debug APK
        run: |
          mkdir -p "$(dirname "$APK_PATH")"
          godot --headless --path "$PROJECT_PATH" --export-debug "Android Debug" "${GITHUB_WORKSPACE}/${APK_PATH}"
          test -s "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xuwyx-Case-2.43.0-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
